version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisansathi-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - CHUNKING_STRATEGY=recursive
      - RETRIEVAL_CONFIDENCE_THRESHOLD=0.62
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisansathi-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
